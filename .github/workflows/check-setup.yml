name: Check smoke setup
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check files, configuration and syntax (no model call)
        run: python scripts/check_setup.py
      - name: Prepare pinned official plugin
        run: python scripts/prepare_plugin.py
      - name: Install validator dependency
        run: python -m pip install -r requirements.txt
      - name: Exercise official validator regression fixtures (not live agent execution)
        working-directory: .deps/bcquality
        run: |
          python .github/scripts/test_knowledge_response.py
          python .github/scripts/test_knowledge_response_semantics.py
      - name: Regression tests for response acceptance
        run: python -m unittest discover -s tests -v
      - name: Validate saved report structures (missing reads do not skip this)
        run: python scripts/validate_saved_reports.py > report-validation.json
      - name: Preserve retrospective validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-structure-validation
          path: report-validation.json
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned SDK and compiler
        run: npm install --no-audit --no-fund
      - name: Collector rejection and capture tests (synthetic events)
        run: npm test
      - name: Check pinned SDK API types
        run: npm run check:sdk
      - name: Offline runner preflight (no runtime/model)
        run: node scripts/run_copilot.mjs --offline-check
      - name: Runtime preflight (no model call; unauthenticated is expected in CI)
        shell: bash
        run: |
          set +e
          node scripts/run_copilot.mjs --preflight
          result=$?
          if [ "$result" -ne 0 ] && [ "$result" -ne 3 ]; then exit "$result"; fi
      - name: Preserve runner preflight and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-runner-preflight
          path: |
            output/copilot/**/summary.json
            output/copilot/**/manifest.json
            output/copilot/**/runtime-status.json
            output/copilot/**/auth-status.json
            package-lock.json
