name: Verify AL-Go prepared plugin handoff
on:
  push:
    paths: ['scripts/prepared_plugin.mjs','scripts/run_copilot.mjs','.github/workflows/check-prepared-plugin.yml','consumer-pilot/**']
  pull_request:
    paths: ['scripts/prepared_plugin.mjs','scripts/run_copilot.mjs','.github/workflows/check-prepared-plugin.yml','consumer-pilot/**']
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm ci --no-audit --no-fund
          python -m pip install -r requirements.txt
      - name: Check out the reviewed official BCQuality source
        uses: actions/checkout@v4
        with:
          repository: microsoft/BCQuality
          ref: a56b272c6b950c2a423bbeda190585cd53beca2a
          path: .barista-source
          persist-credentials: false
      - name: Materialize verified plugin input for SetupBCQuality
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git -C .barista-source rev-parse HEAD)
          test "$sha" = "a56b272c6b950c2a423bbeda190585cd53beca2a"
          mkdir "$RUNNER_TEMP/barista-prepared"
          git -C .barista-source archive HEAD | tar -x -C "$RUNNER_TEMP/barista-prepared"
          echo "BARISTA_VERIFIED_SOURCE=$sha" >> "$GITHUB_ENV"
      - uses: microsoft/AL-Go/Actions/SetupBCQuality@adb81ccf121dfbf1de8fe4ae2da7e7474528bed9
        env:
          SETUP_BCQUALITY_PLUGIN_ROOT: ${{ runner.temp }}/barista-prepared
        id: plugin
        with:
          marketplaceRef: reviewed-source-archive
          enabledLayers: microsoft
          knowledgeAllow: microsoft/knowledge/security/*
      - name: Exercise both inputs against the actual filtered installation
        env:
          PLUGIN_ROOT: ${{ steps.plugin.outputs.pluginRoot }}
          FILTER_HASH: ${{ steps.plugin.outputs.contentHash }}
        run: |
          set -eu
          test -f "$PLUGIN_ROOT/microsoft/knowledge/security/secrets-isolated-storage.md"
          test ! -e "$PLUGIN_ROOT/microsoft/knowledge/testing/testisolation-belongs-on-the-test-runner.md"
          for kind in issue pull_request; do
            node scripts/run_copilot.mjs --offline-check --prepared-root "$PLUGIN_ROOT" --prepared-hash "$FILTER_HASH" --task-context "consumer-pilot/checks/$kind.json"
          done
          if node scripts/run_copilot.mjs --offline-check --prepared-root "$PLUGIN_ROOT" --prepared-hash "$(printf '%064d' 0)" --task-context consumer-pilot/checks/issue.json; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-plugin-probes
          path: |
            output/copilot/**/manifest.json
            output/copilot/**/source.json
            output/copilot/**/filter-report.json
            output/copilot/**/summary.json
