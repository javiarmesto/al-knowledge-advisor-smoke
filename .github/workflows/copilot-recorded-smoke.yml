name: Recorded Copilot smoke
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Exact Copilot model ID available to the credential'
        required: true
        type: string
      questions:
        description: 'Maximum questions (1-4)'
        type: choice
        options: ['1', '2', '3', '4']
        default: '1'
      credits:
        description: 'Requested AI Credits limit per SDK session'
        type: choice
        options: ['2', '5', '10']
        default: '5'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare consumer and pinned plugin
        run: |
          python -m pip install -r requirements.txt
          python scripts/prepare_plugin.py
          npm ci --no-audit --no-fund
      - name: Check credential presence
        env:
          COPILOT_SMOKE_TOKEN: ${{ secrets.COPILOT_SMOKE_TOKEN }}
        run: |
          if [ -z "$COPILOT_SMOKE_TOKEN" ]; then
            echo "::error::Set COPILOT_SMOKE_TOKEN with Copilot access; GITHUB_TOKEN is not a substitute."
            exit 1
          fi
      - name: Record and validate actual Copilot execution
        env:
          COPILOT_SMOKE_TOKEN: ${{ secrets.COPILOT_SMOKE_TOKEN }}
          SMOKE_MODEL: ${{ inputs.model }}
          SMOKE_QUESTIONS: ${{ inputs.questions }}
          SMOKE_CREDITS: ${{ inputs.credits }}
        run: node scripts/run_copilot.mjs --run --model "$SMOKE_MODEL" --max-questions "$SMOKE_QUESTIONS" --max-credits "$SMOKE_CREDITS" --timeout 600
      - name: Upload host evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-copilot-smoke
          path: |
            output/copilot/**/summary.json
            output/copilot/**/manifest.json
            output/copilot/**/python-preflight.json
            output/copilot/**/runtime-status.json
            output/copilot/**/auth-status.json
            output/copilot/**/plan/**
            output/copilot/**/q*/**
          if-no-files-found: warn
